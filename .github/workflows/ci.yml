# Group 9 public release gates (automated subset).
# Signing/notarization remain owner-executed; see docs/release.md.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Lockfile check
        run: uv lock --check

      - name: Sync test extras
        run: uv sync --python ${{ matrix.python-version }} --extra test

      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests

      - name: Core pytest (optional integrations excluded)
        run: uv run --python ${{ matrix.python-version }} pytest -q --ignore=tests/handoff -m "not aptus_integration and not profile_integration and not columnar_integration"

  # Independent of the matrix so packaging signal is not lost when one cell fails.
  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Wheel build and clean-venv CLI smoke
        run: bash scripts/release/smoke_install.sh
        env:
          UV_PYTHON: "3.12"
          SMOKE_PYTHON: "3.12"

  golden-compile:
    name: golden-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync test extras
        run: uv sync --python 3.12 --extra test
      - name: Standalone golden seal + verify + transport
        run: bash scripts/release/golden_compile.sh
        env:
          GOLDEN_EVIDENCE_DIR: ${{ runner.temp }}/golden-evidence
      - name: Upload golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-compile-evidence
          path: ${{ runner.temp }}/golden-evidence
          if-no-files-found: ignore

  # Explicit adapter self-conformance evidence. This signal is visible but cannot block
  # the standalone Veriformis release path.
  aptus-integration:
    name: aptus-integration (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync test extras
        run: uv sync --python 3.12 --extra test
      - name: Optional Aptus pytest selection
        run: uv run --python 3.12 pytest -q -m "aptus_integration"
      - name: Explicit Aptus adapter self-conformance
        run: bash scripts/release/aptus_integration.sh
        env:
          APTUS_EVIDENCE_DIR: ${{ runner.temp }}/aptus-evidence
      - name: Upload optional integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aptus-integration-evidence
          path: ${{ runner.temp }}/aptus-evidence
          if-no-files-found: ignore

  # Isolated trainer-schema evidence. Visible but cannot block standalone release.
  # Extras remain empty; the job runs importorskip tests without installing torch/mlx.
  profile-integration:
    name: profile-integration (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync test extras
        run: uv sync --python 3.12 --extra test
      - name: Optional trainer-schema pytest selection
        run: uv run --python 3.12 pytest -q -m "profile_integration"

  # Isolated columnar library-reload evidence. Visible but cannot block standalone release.
  # Extra columnar stays empty in the lock; this job installs pin-range wheels only here.
  columnar-integration:
    name: columnar-integration (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync test extras
        run: uv sync --python 3.12 --extra test
      - name: Optional PyArrow/Datasets pytest selection
        run: uv run --python 3.12 --with 'pyarrow>=19.0.0,<26.0.0' --with 'datasets>=3.0.0,<6.0.0' pytest -q -m "columnar_integration"
        env:
          HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
