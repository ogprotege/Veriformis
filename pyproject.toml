# pyproject.toml
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veriformis"
dynamic = ["version"]
description = "Local-first dataset compiler: raw documents to validated, provenance-sealed fine-tuning bundles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["dataset", "fine-tuning", "llm", "provenance", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "python-docx>=1.1",
  "lxml>=4.9",
  "pydantic>=2.10,<3",
  "typer>=0.12",
  "jinja2>=3.1",
  "pypdfium2>=5.12.1",
  "pyyaml>=6.0.3",
  "mcp>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff==0.16.0"]
# Isolation extras declared in Phase 8.2 and Phase 9.1. Version ranges live
# in admission or schema pins. Packages are installed by later harnesses,
# not core.
trl = []
mlx-lm = []
columnar = []

[project.scripts]
veriformis = "veriformis.cli:main"

[project.urls]
Repository = "https://github.com/ogprotege/Veriformis"
Issues = "https://github.com/ogprotege/Veriformis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "veriformis.__version__" }

[tool.setuptools.package-data]
veriformis = ["serializers/templates/chat/*.jinja", "goals/*.json", "mapping/*.json", "profiles/*.json", "exports/*.json"]

[tool.ruff]
required-version = "==0.16.0"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["veriformis"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
markers = [
  "aptus_integration: optional Aptus compatibility checks excluded from core release gates",
  "profile_integration: optional TRL/MLX-LM loader checks excluded from core release gates",
  "columnar_integration: optional PyArrow/Datasets loader checks excluded from core release gates",
]
