<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 348" role="img" aria-label="The six-file sealed bundle">
  <title>minimal-v1 bundle</title>
  <rect width="1120" height="348" fill="#1C1914"/>
  <rect x="20" y="20" width="1080" height="308" fill="none" stroke="#3A342C" stroke-width="1"/>

  <text x="48" y="54" fill="#9A917F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6">MINIMAL-V1  ·  SIX FILES  ·  CLOSED SET</text>
  <line x1="48" y1="70" x2="1072" y2="70" stroke="#B08A4F" stroke-width="0.7"/>

  <text x="72" y="108" fill="#7A7368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">example.vfbundle/</text>

  <rect x="48" y="126" width="5" height="188" fill="#6E2430"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="96" y="148" fill="#E4D9C0">data/train.jsonl</text>
    <text x="528" y="148" fill="#9A917F">supervised rows, payload only</text>
    <line x1="96" y1="160" x2="1072" y2="160" stroke="#3A342C" stroke-width="0.6"/>
    <text x="96" y="180" fill="#E4D9C0">data/evaluation.jsonl</text>
    <text x="528" y="180" fill="#9A917F">held-out rows, same schema</text>
    <line x1="96" y1="192" x2="1072" y2="192" stroke="#3A342C" stroke-width="0.6"/>
    <text x="96" y="212" fill="#E4D9C0">metadata/row-provenance.jsonl</text>
    <text x="528" y="212" fill="#9A917F">aligned, one line per row</text>
    <line x1="96" y1="224" x2="1072" y2="224" stroke="#3A342C" stroke-width="0.6"/>
    <text x="96" y="244" fill="#E4D9C0">validation.json</text>
    <text x="528" y="244" fill="#9A917F">seventeen ordered gates</text>
    <line x1="96" y1="256" x2="1072" y2="256" stroke="#3A342C" stroke-width="0.6"/>
    <text x="96" y="276" fill="#E4D9C0">manifest.json</text>
    <text x="528" y="276" fill="#9A917F">retain this SHA-256 out of band</text>
    <line x1="96" y1="288" x2="1072" y2="288" stroke="#3A342C" stroke-width="0.6"/>
    <text x="96" y="308" fill="#E4D9C0">attestation.json</text>
    <text x="528" y="308" fill="#9A917F">internal agreement, not a public notary</text>
  </g>
</svg>
