<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 348" role="img" aria-label="The six-file sealed bundle">
  <title>minimal-v1 bundle</title>
  <rect width="1120" height="348" fill="#F4F5F7"/>
  <rect x="20.5" y="20.5" width="1079" height="307" fill="none" stroke="#12141A" stroke-width="1"/>

  <text x="48" y="54" fill="#5C656E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6">MINIMAL-V1  ·  SIX FILES  ·  CLOSED SET</text>
  <line x1="48" y1="70" x2="1072" y2="70" stroke="#CC1A33" stroke-width="1.2"/>

  <text x="72" y="108" fill="#5C656E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">example.vfbundle/</text>

  <rect x="48" y="126" width="5" height="188" fill="#CC1A33"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="96" y="148" fill="#12141A">data/train.jsonl</text>
    <text x="528" y="148" fill="#5C656E">supervised rows, payload only</text>
    <line x1="96" y1="160" x2="1072" y2="160" stroke="#D5D9DF" stroke-width="0.8"/>
    <text x="96" y="180" fill="#12141A">data/evaluation.jsonl</text>
    <text x="528" y="180" fill="#5C656E">held-out rows, same schema</text>
    <line x1="96" y1="192" x2="1072" y2="192" stroke="#D5D9DF" stroke-width="0.8"/>
    <text x="96" y="212" fill="#12141A">metadata/row-provenance.jsonl</text>
    <text x="528" y="212" fill="#5C656E">aligned, one line per row</text>
    <line x1="96" y1="224" x2="1072" y2="224" stroke="#D5D9DF" stroke-width="0.8"/>
    <text x="96" y="244" fill="#12141A">validation.json</text>
    <text x="528" y="244" fill="#5C656E">seventeen ordered gates</text>
    <line x1="96" y1="256" x2="1072" y2="256" stroke="#D5D9DF" stroke-width="0.8"/>
    <text x="96" y="276" fill="#12141A">manifest.json</text>
    <text x="528" y="276" fill="#5C656E">retain this SHA-256 out of band</text>
    <line x1="96" y1="288" x2="1072" y2="288" stroke="#D5D9DF" stroke-width="0.8"/>
    <text x="96" y="308" fill="#12141A">attestation.json</text>
    <text x="528" y="308" fill="#5C656E">internal agreement, not a public notary</text>
  </g>
</svg>
