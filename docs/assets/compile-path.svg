<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 348" role="img" aria-label="Two compiler paths from source to sealed bundle">
  <title>Compiler paths</title>
  <rect width="1120" height="348" fill="#1C1914"/>
  <rect x="20" y="20" width="1080" height="308" fill="none" stroke="#3A342C" stroke-width="1"/>

  <text x="48" y="52" fill="#9A917F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6">DOCUMENT-SOURCE  ·  DEFAULT</text>
  <line x1="56" y1="112" x2="1064" y2="112" stroke="#B08A4F" stroke-width="1.15"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4" text-anchor="middle">
    <g transform="translate(72 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">parse</text>
    </g>
    <g transform="translate(183 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">clean</text>
    </g>
    <g transform="translate(294 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">chunk</text>
    </g>
    <g transform="translate(405 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">construct</text>
    </g>
    <g transform="translate(516 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">curate</text>
    </g>
    <g transform="translate(627 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">split</text>
    </g>
    <g transform="translate(738 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">format</text>
    </g>
    <g transform="translate(849 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">validate</text>
    </g>
    <g transform="translate(956 112)">
      <circle r="8.2" fill="#6E2430" stroke="#B08A4F" stroke-width="1.2"/>
      <text y="-18" fill="#E4D9C0" font-size="12" letter-spacing="1.6">SEAL</text>
    </g>
    <g transform="translate(1048 112)">
      <circle r="4.6" fill="#1C1914" stroke="#E4D9C0" stroke-width="1.3"/>
      <text y="-16" fill="#E4D9C0">verify</text>
    </g>
  </g>

  <text x="48" y="180" fill="#9A917F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6">DATASET-ROW  ·  OPT-IN</text>
  <line x1="56" y1="240" x2="1064" y2="240" stroke="#8A7E68" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4" text-anchor="middle">
    <g transform="translate(72 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">parse</text>
    </g>
    <g transform="translate(227 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">map</text>
    </g>
    <g transform="translate(382 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">curate</text>
    </g>
    <g transform="translate(538 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">split</text>
    </g>
    <g transform="translate(693 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">format</text>
    </g>
    <g transform="translate(849 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">validate</text>
    </g>
    <g transform="translate(956 240)">
      <circle r="8.2" fill="#6E2430" stroke="#B08A4F" stroke-width="1.2"/>
      <text y="-18" fill="#E4D9C0" font-size="12" letter-spacing="1.6">SEAL</text>
    </g>
    <g transform="translate(1048 240)">
      <circle r="4.6" fill="#1C1914" stroke="#C9BFA8" stroke-width="1.3"/>
      <text y="-16" fill="#C9BFA8">verify</text>
    </g>
  </g>

  <text x="48" y="304" fill="#7A7368" font-family="Iowan Old Style, Palatino, Palatino Linotype, Georgia, serif" font-size="13">The wax mark is the only filled station. Everything before it is compiler state.</text>
</svg>
