<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 348" role="img" aria-label="Two compiler paths from source to sealed bundle">
  <title>Compiler paths</title>
  <rect width="1120" height="348" fill="#F4F5F7"/>
  <rect x="20.5" y="20.5" width="1079" height="307" fill="none" stroke="#12141A" stroke-width="1"/>

  <text x="48" y="52" fill="#5C656E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6">DOCUMENT-SOURCE  ·  DEFAULT</text>
  <line x1="56" y1="112" x2="1064" y2="112" stroke="#12141A" stroke-width="1.15"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4" text-anchor="middle">
    <g transform="translate(72 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">parse</text>
    </g>
    <g transform="translate(183 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">clean</text>
    </g>
    <g transform="translate(294 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">chunk</text>
    </g>
    <g transform="translate(405 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">construct</text>
    </g>
    <g transform="translate(516 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">curate</text>
    </g>
    <g transform="translate(627 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">split</text>
    </g>
    <g transform="translate(738 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">format</text>
    </g>
    <g transform="translate(849 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">validate</text>
    </g>
    <g transform="translate(956 112)">
      <circle r="8.2" fill="#CC1A33" stroke="#12141A" stroke-width="1.05"/>
      <text y="-18" fill="#12141A" font-size="12" letter-spacing="1.6">SEAL</text>
    </g>
    <g transform="translate(1048 112)">
      <circle r="4.6" fill="#F4F5F7" stroke="#12141A" stroke-width="1.3"/>
      <text y="-16" fill="#12141A">verify</text>
    </g>
  </g>

  <text x="48" y="180" fill="#5C656E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.6">DATASET-ROW  ·  OPT-IN</text>
  <line x1="56" y1="240" x2="1064" y2="240" stroke="#8A929A" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.4" text-anchor="middle">
    <g transform="translate(72 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">parse</text>
    </g>
    <g transform="translate(227 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">map</text>
    </g>
    <g transform="translate(382 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">curate</text>
    </g>
    <g transform="translate(538 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">split</text>
    </g>
    <g transform="translate(693 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">format</text>
    </g>
    <g transform="translate(849 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">validate</text>
    </g>
    <g transform="translate(956 240)">
      <circle r="8.2" fill="#CC1A33" stroke="#12141A" stroke-width="1.05"/>
      <text y="-18" fill="#12141A" font-size="12" letter-spacing="1.6">SEAL</text>
    </g>
    <g transform="translate(1048 240)">
      <circle r="4.6" fill="#F4F5F7" stroke="#5C656E" stroke-width="1.3"/>
      <text y="-16" fill="#5C656E">verify</text>
    </g>
  </g>

  <text x="48" y="304" fill="#5C656E" font-family="Iowan Old Style, Palatino, Palatino Linotype, Georgia, serif" font-size="13">The wax mark is the only filled station. Everything before it is compiler state.</text>
</svg>
